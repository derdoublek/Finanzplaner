<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f1a14;
        --ink: #f4f1ea;
        --accent: #c9a24a;
        --font-display: "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 0 96px;
      }
      .kicker {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 40px;
      }
      .headline {
        font-size: 128px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }
      .headline-sm { font-size: 112px; }
      .body {
        margin-top: 48px;
        font-size: 56px;
        line-height: 1.3;
        font-weight: 400;
        max-width: 880px;
      }
      .bar {
        position: absolute;
        left: 96px;
        bottom: 160px;
        height: 6px;
        width: 888px;
        background: rgba(244, 241, 234, 0.15);
        border-radius: 3px;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--accent);
        transform-origin: left center;
      }
      .brand {
        position: absolute;
        left: 96px;
        bottom: 96px;
        font-size: 36px;
        font-weight: 600;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <!-- Szene 1: Hook -->
      <section id="s1" class="scene clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="kicker">Geldtipp</div>
        <h1 class="headline">Kein<br />Notgroschen?</h1>
      </section>

      <!-- Szene 2: Regel -->
      <section id="s2" class="scene clip" data-start="5" data-duration="6" data-track-index="1">
        <div class="kicker">Die Faustregel</div>
        <h2 class="headline headline-sm">3 Monatsausgaben</h2>
        <p class="body">So viel sollte auf einem separaten Tagesgeldkonto liegen.</p>
      </section>

      <!-- Szene 3: Umsetzung -->
      <section id="s3" class="scene clip" data-start="11" data-duration="6" data-track-index="2">
        <div class="kicker">So geht's</div>
        <h2 class="headline">Ein eigenes Konto</h2>
        <p class="body">Jeden Monat einen festen Betrag überweisen, bis das Ziel erreicht ist.</p>
      </section>

      <!-- Szene 4: CTA -->
      <section id="s4" class="scene clip" data-start="17" data-duration="3" data-track-index="3">
        <div class="kicker">Mehr dazu</div>
        <h2 class="headline">finanzielle-ordnung.de</h2>
      </section>

      <div id="progress-bar" class="bar clip" data-start="0" data-duration="20" data-track-index="4"><span id="progress"></span></div>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="20" data-track-index="6" data-volume="0.35"></audio>
      <div id="brand" class="brand clip" data-start="0" data-duration="20" data-track-index="5">Finanzielle Ordnung</div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Initial states: sofort setzen, nicht in der Timeline
      gsap.set(["#s2", "#s3", "#s4"], { opacity: 0 });

      // Szene 1
      tl.fromTo("#s1 .kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#s1 .headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 0.3);
      tl.to("#s1", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6);

      // Szene 2
      tl.set("#s2", { opacity: 1 }, 5);
      tl.fromTo("#s2 .kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.1);
      tl.fromTo("#s2 .headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 5.3);
      tl.fromTo("#s2 .body", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.9);
      tl.to("#s2", { opacity: 0, duration: 0.4, ease: "power2.in" }, 10.6);

      // Szene 3
      tl.set("#s3", { opacity: 1 }, 11);
      tl.fromTo("#s3 .kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.1);
      tl.fromTo("#s3 .headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 11.3);
      tl.fromTo("#s3 .body", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 11.9);
      tl.to("#s3", { opacity: 0, duration: 0.4, ease: "power2.in" }, 16.6);

      // Szene 4
      tl.set("#s4", { opacity: 1 }, 17);
      tl.fromTo("#s4 .kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 17.1);
      tl.fromTo("#s4 .headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 17.3);

      // Fortschrittsbalken über die gesamte Laufzeit
      tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: 20, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
