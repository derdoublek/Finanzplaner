<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Finance OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Family Finance OS</h1>
    </header>

    <div class="grid">
      <!-- Einkommen Karte -->
      <div class="card">
        <h2>💰 Einkommen</h2>
        <div class="form-group">
          <label for="netto-einkommen">Monatliches Netto</label>
          <div class="input-prefix">
            <input type="number" id="netto-einkommen" step="0.01" placeholder="0">
            <span>€</span>
          </div>
        </div>
      </div>

      <!-- Gläubigerkonto Karte (Variante B: Minimalistisch) -->
      <div class="card">
        <h2>🏛️ Gläubigerkonto</h2>
        <div class="form-group">
          <label for="glaeubiger-stand">Aktueller Stand</label>
          <div class="input-prefix">
            <input type="number" id="glaeubiger-stand" step="0.01" placeholder="0">
            <span>€</span>
          </div>
        </div>
        <div class="result-box">
          <span class="label">Benötigt für Gläubiger</span>
          <div class="big" id="glaeubiger-bedarf">1.900,00 €</div>
        </div>
      </div>
    </div>

    <!-- Gläubiger-Tabelle / Positionen -->
    <div class="card full-width">
      <h2>📋 Gläubiger & Verpflichtungen</h2>
      <table id="glaeubiger-tabelle">
        <thead>
          <tr>
            <th>Name / Gläubiger</th>
            <th>Rate / Betrag (€)</th>
            <th>Aktion</th>
          </tr>
        </thead>
        <tbody id="glaeubiger-liste">
          <!-- Dynamisch per JS befüllt -->
        </tbody>
      </table>
      
      <div class="add-form">
        <input type="text" id="neuer-name" placeholder="Name des Gläubigers">
        <input type="number" id="neuer-betrag" step="0.01" placeholder="Betrag (€)">
        <button id="btn-hinzufuegen">Hinzufügen</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
